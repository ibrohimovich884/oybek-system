<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#282624" />
      <stop offset="100%" stop-color="#181716" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ea896" />
      <stop offset="100%" stop-color="#4d7c6e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Full bleed background -->
  <rect width="512" height="512" fill="#1c1b1a" />

  <!-- Inner Badge (safe zone compliant) -->
  <rect x="64" y="64" width="384" height="384" rx="96" fill="url(#bgGrad)" stroke="#3a3833" stroke-width="6" filter="url(#glow)" />

  <!-- Accent Corner Glow or Accent Bar -->
  <rect x="180" y="104" width="152" height="6" rx="3" fill="url(#accentGrad)" />

  <!-- Modern Stylized "O" / System emblem -->
  <!-- Outer Ring of O -->
  <circle cx="256" cy="256" r="102" fill="none" stroke="#f2efe8" stroke-width="22" stroke-linecap="round" />
  
  <!-- Accent Inner Core with System Node -->
  <circle cx="256" cy="256" r="54" fill="none" stroke="url(#accentGrad)" stroke-width="16" stroke-dasharray="160 50" />
  <circle cx="256" cy="256" r="22" fill="url(#accentGrad)" />

  <!-- Top and Bottom System Axis indicators -->
  <line x1="256" y1="124" x2="256" y2="142" stroke="url(#accentGrad)" stroke-width="8" stroke-linecap="round" />
  <line x1="256" y1="370" x2="256" y2="388" stroke="url(#accentGrad)" stroke-width="8" stroke-linecap="round" />
  <line x1="124" y1="256" x2="142" y2="256" stroke="url(#accentGrad)" stroke-width="8" stroke-linecap="round" />
  <line x1="370" y1="256" x2="388" y2="256" stroke="url(#accentGrad)" stroke-width="8" stroke-linecap="round" />

  <!-- Sub-label tag "OYBEK" in monospace aesthetic -->
  <text x="256" y="418" text-anchor="middle" fill="#a39c8e" font-family="'IBM Plex Mono', monospace, sans-serif" font-size="28" font-weight="700" letter-spacing="6">OYBEK</text>
</svg>
